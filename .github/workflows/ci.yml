name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-19 cppcheck
      - run: CXX=g++-14 CFLAGS=-Werror make
      - run: find src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - run: find src -type f -name '*.cpp' -print0 | xargs -0 clang-tidy-19 -p build/cmake --warnings-as-errors='*'
      - run: cppcheck --std=c++23  $(cat .cppcheck | tr '\n' ' ') --error-exitcode=1 --quiet src/
