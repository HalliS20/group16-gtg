name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-19 cppcheck
      - run: CFLAGS=-Werror make x86_64-debug
      - run: clang-format --dry-run --Werror src/*
      - run: clang-tidy-19 -p build/cmake --warnings-as-errors='*' src/*.cpp
      - run: cppcheck --std=c++23  $(cat .cppcheck | tr '\n' ' ') --error-exitcode=1 --quiet src/

  build:
    runs-on: ubuntu-latest-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build cmake
      - run: cmake -S . -G Ninja build/cmake && cmake --build build/cmake
