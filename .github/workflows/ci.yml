name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: CXX=g++-14 CFLAGS=-Werror make
      - run: clang-format --dry-run --Werror src/*
      - run: clang-tidy -p build/cmake --warnings-as-errors='*' src/*.cpp
      - run: sudo apt-get install -y cppcheck
      - run: cppcheck --std=c++23  $(cat .cppcheck | tr '\n' ' ') --error-exitcode=1 --quiet src/
